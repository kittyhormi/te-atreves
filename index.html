<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#641b24">

  <title>¿Te atreves?</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Patrick+Hand&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Permanent+Marker&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <script src="journal.js" defer></script>
</head>

<body>
  <main class="scene">

    <section class="book-area">
      <div id="book"></div>
    </section>

    <nav class="controls">
      <button id="prevPage" aria-label="Página anterior">←</button>
      <span id="pageCounter">Portada</span>
      <button id="nextPage" aria-label="Página siguiente">→</button>
    </nav>

    <footer>
      <p>Da vuelta a la pagina. Descubre qué pasa.</p>
    </footer>

  </main>
</body>
</html>
